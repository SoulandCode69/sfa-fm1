<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SFA Analyzer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22sfaG%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23a06bff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236226f5%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22url%28%23sfaG%29%22/%3E%3Cpath%20d%3D%22M22.5%209.75H14.25a3.25%203.25%200%200%200%200%206.5h3.5a3.25%203.25%200%200%201%200%206.5H13%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%228.6%22%20cy%3D%2222.75%22%20r%3D%222.1%22%20fill%3D%22%23ff2e7e%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap">
<style>
/* Layout: a console. Files down the left, the picture (waveform, spectrogram, spectrum) in the middle, the numbers on the right.
   Palette: ink with a violet cast, bone text, one hot "sin" red for the accent, teal / amber / violet / lime for overlays. */
:root {
  --bg: #f3f1fb; --panel: #ffffff; --panel2: #ebe8f8; --rule: #dcd7ee; --fg: #0c0a1c; --dim: #5d5880;
  --accent: #6d35f0; --accent-fg: #ffffff; --good: #06a765; --warn: #c96f00; --bad: #e5283a;
  --c1: #ff2e7e; --c2: #6a3dff; --c3: #c27a00; --c4: #6d4fd6; --c5: #4c8f1c;
  --plot: #ffffff; --grid: #e4e0f3; --wave: #1d1740;
  --display: "Syne", "Arial Black", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root[data-theme="auto"] {
  --bg: #0c0a17; --panel: #141124; --panel2: #1b1730; --rule: #272243; --fg: #f2f0ff; --dim: #a19bc4;
  --accent: #8348ff; --accent-fg: #ffffff; --good: #4fd08a; --warn: #ffb347; --bad: #ff5a6e;
  --c1: #ff3d6e; --c2: #38d6c4; --c3: #ffb347; --c4: #a78bfa; --c5: #8bd450;
  --plot: #0f0d14; --grid: #25212e; --wave: #cfc6dc; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0a17; --panel: #141124; --panel2: #1b1730; --rule: #272243; --fg: #f2f0ff; --dim: #a19bc4;
  --accent: #8348ff; --accent-fg: #ffffff; --good: #4fd08a; --warn: #ffb347; --bad: #ff5a6e;
  --c1: #ff3d6e; --c2: #38d6c4; --c3: #ffb347; --c4: #a78bfa; --c5: #8bd450;
  --plot: #0f0d14; --grid: #25212e; --wave: #cfc6dc; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--body); min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.on { border-color: var(--accent); color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, .file:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select { background: var(--panel2); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 6px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.mark { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.mark svg { display: block; }
.mark b { font: 800 19px/1 var(--display); letter-spacing: .02em; }
.mark span { font: 500 11px/1 var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.sp { flex: 1 1 auto; }
.ctl { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
.readout { font: 500 12px/1.2 var(--mono); color: var(--dim); }
.readout b { color: var(--fg); font-weight: 500; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 64px; max-height: calc(100vh - 80px); }
.drop { border: 1px dashed var(--dim); border-radius: 6px; padding: 14px 12px; text-align: center; color: var(--dim); cursor: pointer; background: var(--panel); }
.drop.over { border-color: var(--accent); color: var(--accent); background: var(--panel2); }
.drop b { display: block; color: var(--fg); font: 700 14px/1.2 var(--display); margin-bottom: 4px; }
.hist { position: absolute; z-index: 20; right: 12px; top: 52px; width: min(460px, calc(100vw - 24px)); max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.hist h3 { margin: 10px 0 6px; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); } .hist h3:first-child { margin-top: 0; }
.hist .run, .hist .fav { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 12px; } .hist .run span.nm, .hist .fav span.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .star { border: 0; background: none; padding: 0 2px; color: var(--dim); cursor: pointer; } .file .star.on { color: var(--warn); }
.sumbar { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 2px; } .sumbar:empty { display: none; } .sumbar button { padding: 3px 8px; font: 500 11px var(--mono); border-radius: 999px; } .sumbar button.on { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.reasons li small { display: block; color: var(--dim); margin-left: 12px; }
.files { overflow: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.group { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 8px 2px 2px; }
.file { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 8px; padding: 7px 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; cursor: pointer; align-items: center; }
.file.act { border-color: var(--accent); background: var(--panel2); }
.file .chip { width: 10px; height: 10px; border-radius: 2px; border: 2px solid var(--c); background: transparent; cursor: pointer; padding: 0; }
.file .chip.on { background: var(--c); }
.file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.file .sub { grid-column: 2 / 4; font: 400 11px/1.2 var(--mono); color: var(--dim); }
.file .x { border: 0; background: none; padding: 0 2px; color: var(--dim); }
.pill { font: 500 10px/1 var(--mono); letter-spacing: .08em; padding: 3px 6px; border-radius: 3px; border: 1px solid currentColor; text-transform: uppercase; }
.pill.clean { color: var(--good); } .pill.watch { color: var(--warn); } .pill.flag { color: var(--bad); } .pill.busy { color: var(--dim); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.viz, .meters { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.card h3 { margin: 0 0 8px; font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.card h3 .tools { display: flex; gap: 6px; align-items: center; letter-spacing: 0; text-transform: none; }
.plot { position: relative; width: 100%; }
.plot canvas { display: block; width: 100%; height: 100%; border-radius: 3px; touch-action: none; }
#pWave { height: 120px; } #pSg { height: 250px; } #pSp { height: 300px; }
#pGon { width: 100%; aspect-ratio: 1 / 1; max-width: 230px; margin: 0 auto; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px; font: 500 11px/1.3 var(--mono); white-space: nowrap; z-index: 3; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.kv { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kv label { font: 500 10px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.kv output { font: 500 17px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.kv small { font: 400 10px/1.2 var(--mono); color: var(--dim); }
.ok { color: var(--good); } .wn { color: var(--warn); } .bd { color: var(--bad); }
.reasons { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.reasons li::before { content: "\25AA\00a0"; color: var(--dim); }
.clicks { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-height: 84px; overflow: auto; }
.clicks button { font: 500 11px/1 var(--mono); padding: 3px 6px; }
.empty { color: var(--dim); text-align: center; padding: 38px 10px; font-size: 13px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font: 400 12px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th { font-weight: 500; color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
th:first-child, td:first-child { text-align: left; }
tr.act td { background: var(--panel2); }
.status { color: var(--dim); font: 400 11px/1.3 var(--mono); }
details > summary { cursor: pointer; font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.abbar { display: none; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; margin-top: 12px; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; }
.abbar.on { display: flex; }
.abbar .side { display: flex; align-items: center; gap: 6px; }
.abbar .side b { font: 800 15px/1 var(--display); width: 18px; }
.abbar select { max-width: 230px; }
.abbar .listen button { min-width: 38px; font-weight: 700; }
.abbar .listen button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
td.up { color: var(--warn); } td.dn { color: var(--c2); } td.eq { color: var(--dim); }
.rules { color: var(--dim); font-size: 12px; margin: 8px 0 0; }

@media (max-width: 1180px) { .stage { grid-template-columns: minmax(0, 1fr); } .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
@media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } .side { position: static; max-height: none; } .files { max-height: 240px; } header { position: static; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* 2026-11-10: the console's bright look. White work surfaces, rounder controls, filled state pills. */
:root { --soft-good: #e0f5ea; --soft-warn: #fdf0d9; --soft-bad: #fde6e6; --blue: #6a3dff; --shadow: 0 1px 2px rgba(28,16,80,.07), 0 6px 18px rgba(28,16,80,.06); }
:root[data-theme="dark"] { --soft-good: #10301f; --soft-warn: #35270d; --soft-bad: #3a1616; --blue: #2fd9f4; --shadow: none; }
body { -webkit-font-smoothing: antialiased; }
button { background: var(--panel); border-radius: 8px; padding: 6px 12px; font-weight: 500; transition: background .12s, border-color .12s; }
button:hover:not(:disabled) { border-color: var(--fg); background: var(--panel2); }
button.primary { box-shadow: 0 6px 18px rgba(131,72,255,.28); } button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); border-color: var(--accent); }
button.on { background: var(--fg); color: var(--panel); border-color: var(--fg); }
select, input[type=text], input[type=number] { background: var(--panel); border-radius: 8px; }
.card { border-radius: 12px; box-shadow: var(--shadow); }
.pill { border: 0; border-radius: 999px; padding: 4px 7px; font-weight: 600; }
.pill.clean { background: var(--soft-good); } .pill.watch { background: var(--soft-warn); } .pill.flag { background: var(--soft-bad); } .pill.busy { background: var(--panel2); }
.drop { border-radius: 12px; background: var(--panel); }
:is(button, select, input, [tabindex]):focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
/* SFA identity: ink header with the signal stripe */
body > header { background: #0c0a1c; color: #e9e5ff; margin: 0 -16px 14px; padding-left: 16px; padding-right: 16px; border-bottom: 0; position: sticky; top: 0; z-index: 20; }
body > header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: linear-gradient(90deg, #ff2e7e, #6a3dff 60%, #00b8d9); }
body > header .mark span { color: #c9b6ff; } body > header .readout, body > header label { color: #b9b1e6; }
body > header button:not(.primary) { background: #171430; border-color: transparent; color: #e9e5ff; } body > header button:not(.primary):hover:not(:disabled) { background: #171430; border-color: #c9b6ff; }
body > header button.on { background: #c9b6ff; color: #0c0a1c; border-color: #c9b6ff; } body > header select { background: #171430; color: #e9e5ff; border-color: #2f2a52; }
button.on { background: #0c0a1c; color: #c9b6ff; border-color: #0c0a1c; }
:root[data-theme="dark"] button.on { background: #c9b6ff; color: #0c0a1c; border-color: #c9b6ff; }
/* brand: emblem, wordmark, dark base */
body > header { background: #07060e; border-bottom: 1px solid #1d1a33; }
body > header::after { background: linear-gradient(90deg, #8348ff, #8348ff 30%, #ff2e7e 65%, #2fd9f4); height: 2px; bottom: -1px; }
body > header .mark svg { border-radius: 8px; box-shadow: 0 4px 18px rgba(131,72,255,.45); }
body > header .mark b { letter-spacing: .04em; color: #fff; } body > header .mark span { color: #8a84ad; letter-spacing: .2em; }
:root[data-theme="dark"] button.on { background: #8348ff; color: #fff; border-color: #8348ff; }
:root[data-theme="dark"] .card { box-shadow: none; }
/* violet identity */
button.on, body > header button.on { background: #8348ff; color: #fff; border-color: #8348ff; }
:root[data-theme="dark"] button.on { background: #8348ff; color: #fff; border-color: #8348ff; }
body > header .mark span { font-family: var(--body); letter-spacing: .24em; }
</style>
</head>
<body>
<header>
  <div class="mark">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="sfaG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a06bff"/><stop offset="1" stop-color="#6226f5"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#sfaG)"/><path d="M22.5 9.75H14.25a3.25 3.25 0 0 0 0 6.5h3.5a3.25 3.25 0 0 1 0 6.5H13" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="22.75" r="2.1" fill="#ff2e7e"/></svg>
    <div><b>SFA</b> <span>Analyzer</span></div>
  </div>
  <button class="primary" id="bOpen">Open WAVs</button>
  <input type="file" id="fIn" accept=".wav,.mp3,.flac,.ogg,.m4a,.aif,.aiff,.opus,audio/*" multiple hidden>
  <button id="bPlay" title="Space">Play</button>
  <button id="bLoop" title="Loop the selection">Loop</button>
  <button id="bZoom" title="Z: zoom to the selection, F: fit">Zoom</button>
  <button id="bFit">Fit</button>
  <div class="readout" id="rdSel">no selection</div>
  <span class="sp"></span>
  <label class="ctl">Smooth <select id="sSmooth"><option value="0">off</option><option value="12">1/12 oct</option><option value="6" selected>1/6 oct</option><option value="3">1/3 oct</option></select></label>
  <label class="ctl">Slope <select id="sTilt"><option value="0" selected>flat</option><option value="3">+3 dB/oct</option><option value="4.5">+4.5 dB/oct</option></select></label>
  <label class="ctl">FFT <select id="sFft"><option>1024</option><option selected>2048</option><option>4096</option><option>8192</option></select></label>
  <button id="bHist" title="Past renders and favourites (needs the console)">History</button>
  <button id="bAB" title="Compare two files; keys A and B switch the one you hear and see">A/B</button>
  <button id="bCsv" title="Download the comparison table">CSV</button>
  <button id="bCopy" title="Copy a text report of the active file">Copy report</button>
</header>

<div class="hist" id="hist" hidden></div>
<div class="abbar" id="abBar">
  <div class="side"><b style="color:var(--c1)">A</b><select id="abA" aria-label="File A"></select></div>
  <button id="abSwap" title="Swap A and B">&#8646;</button>
  <div class="side"><b style="color:var(--c2)">B</b><select id="abB" aria-label="File B"></select></div>
  <label class="ctl">Pair <select id="abPair" aria-label="Pairs across units"></select></label>
  <span class="listen" style="display:flex;gap:4px;align-items:center"><span class="readout">Listen</span><button id="abLA" title="A">A</button><button id="abLB" title="B">B</button></span>
  <label class="ctl"><input type="checkbox" id="abMatch" checked> Match loudness</label>
  <span class="readout" id="abNote"></span>
</div>
<div class="shell">
  <aside class="side">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Drop WAV files here or press Enter to browse"><b>Drop WAVs here</b>ECB, Alien Stack, or any 16 / 24 / 32-bit WAV</div>
    <div class="sumbar" id="sumBar"></div>
    <div class="files" id="files"></div>
    <div class="status" id="status">Ready.</div>
  </aside>

  <main class="stage">
    <section class="viz">
      <div class="card"><h3><span id="tName">Waveform</span><span class="tools"><span class="readout" id="rdView"></span></span></h3><div class="plot" id="pWave"><canvas></canvas></div></div>
      <div class="card"><h3><span>Spectrogram</span><span class="tools"><label class="ctl">Floor <select id="sFloor"><option value="-80">-80</option><option value="-100" selected>-100</option><option value="-120">-120</option></select> dB</label></span></h3><div class="plot" id="pSg"><canvas></canvas></div></div>
      <div class="card" id="abCard" hidden><h3><span>A vs B</span><span class="tools"><span class="readout" id="abHead"></span></span></h3><div class="tablewrap"><table id="abTbl"></table></div></div>
      <div class="card"><h3><span>Spectrum <span id="spLegend" style="margin-left:10px"></span></span><span class="tools"><button id="bPeak" class="on">Peak hold</button></span></h3><div class="plot" id="pSp"><canvas></canvas></div></div>
      <div class="card" id="diffCard" hidden><h3><span>Difference, B minus A</span><span class="tools"><span class="readout" id="diffNote"></span></span></h3><div class="plot" id="pDiff" style="height:130px"><canvas></canvas></div></div>
    </section>
    <section class="meters">
      <div class="card"><h3><span>Verdict</span><span class="pill busy" id="vPill">-</span></h3>
        <ul class="reasons" id="vWhy"></ul><div class="clicks" id="vClicks"></div></div>
      <div class="card"><h3><span>Levels</span></h3><div class="grid2" id="mLevels"></div></div>
      <div class="card"><h3><span>Loudness</span><span class="tools" style="color:var(--dim)">BS.1770 / EBU R128</span></h3><div class="grid2" id="mLoud"></div></div>
      <div class="card"><h3><span>Stereo</span></h3><canvas id="pGon" width="230" height="230"></canvas><div class="grid2" id="mStereo" style="margin-top:8px"></div></div>
      <div class="card"><h3><span>Tone</span></h3><div class="grid2" id="mTone"></div></div>
    </section>
  </main>
</div>

<div class="card" style="margin-top:14px"><details open><summary>Compare table</summary>
  <div class="tablewrap" style="margin-top:8px"><table id="tbl"></table></div>
  <p class="rules" id="rulesTxt"></p></details></div>

<script>

$("#bLoop").onclick = () => { S.loop = !S.loop; if (S.play.on) startPlay(); renderHeader(); };
$("#bZoom").onclick = () => { if (S.sel) { S.view = S.sel.slice(); render(); } };
$("#bFit").onclick = () => { S.view = null; render(); };
$("#bPeak").onclick = () => { S.peak = !S.peak; store.set("peak", S.peak ? "1" : "0"); renderHeader(); drawSp(); };
for (const [id, key, prop] of [["#sSmooth", "smooth", "smooth"], ["#sTilt", "tilt", "tilt"], ["#sFft", "fft", "fft"], ["#sFloor", "floor", "floor"]]) { const el = $(id); el.value = String(S[prop]); el.onchange = () => { S[prop] = +el.value; store.set(key, el.value); draw(); }; }
function csv() {
  const rows = [COLS.map(c => c[1])]; S.files.forEach(f => rows.push(COLS.map(c => { const v = c[2](f); return v === null || v === undefined || v === false ? "" : typeof v === "number" ? (isFinite(v) ? +v.toFixed(3) : "") : v; })));
  return rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
}
function report() {
  const f = act(); if (!f || !f.m) return "No analysed file.";
  const m = f.m, l = m.loud; return ["SFA Analyzer: " + f.name, f.sr + " Hz, " + (f.bits ? f.bits + " bit" : "decoded") + ", " + (f.mono ? "mono" : "stereo") + ", " + fmtT(f.dur), "Verdict: " + m.verdict.toUpperCase() + " (" + m.why.map(w => w[1]).join("; ") + ")",
    "Peak " + fmt(m.peakDb) + " dBFS, true peak " + fmt(m.tpDb) + " dBTP, RMS " + fmt(m.rmsDb) + " dBFS, crest " + fmt(m.crest) + " dB", "Loudness: " + fmt(l.I) + " LUFS integrated, " + fmt(l.M) + " momentary max, " + (l.S === null ? "-" : fmt(l.S)) + " short-term max, LRA " + (l.LRA === null ? "-" : fmt(l.LRA)),
    "Stereo: correlation " + m.st.corr.toFixed(2) + " (worst " + m.st.corrMin.toFixed(2) + "), side energy " + (m.st.width * 100).toFixed(0) + " %", "Tone: centroid " + m.centroid.toFixed(0) + " Hz, " + (m.hf * 100).toFixed(1) + " % above 5 kHz, 95 % rolloff " + m.rolloff.toFixed(0) + " Hz",
    "Clicks: " + (m.clickEv.length ? m.clickEv.map(e => e.t.toFixed(3) + "s").join(", ") : "none")].join("\n");
}
function saveText(name, text, mime) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
$("#bCsv").onclick = () => { saveText("sfa-analysis.csv", csv(), "text/csv"); say("CSV saved to your downloads folder."); };
$("#bCopy").onclick = async () => { const t = report(); try { await navigator.clipboard.writeText(t); say("Report copied."); } catch (e) { say(t.split("\n")[2] || "Could not copy."); } };
document.addEventListener("keydown", e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); S.play.on ? stopPlay() : startPlay(); }
  else if (e.key === "Escape") { S.sel = null; S.view = null; render(); }
  else if (e.key === "z" || e.key === "Z") $("#bZoom").click();
  else if (e.key === "f" || e.key === "F") $("#bFit").click();
  else if ((e.key === "n" || e.key === "N") && !e.ctrlKey && !e.metaKey) nextProblem();
  else if ((e.key === "a" || e.key === "A") && S.ab) abSide("a");
  else if ((e.key === "b" || e.key === "B") && S.ab) abSide("b");
  else if (e.key === "ArrowDown") { e.preventDefault(); selectFile(S.act + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); selectFile(S.act - 1); }
});
new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(document.body);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
window.SFA = { abOpen, abPairs, abGain, S, parseWav, welch, loudness, truePeak, findClicks, analyze, addBuffer, loadManifest, report, csv, RULES };   /* a handle for tests and for scripts */

/* ---------- start: a manifest from ?manifest=..., or the default one beside this page when served over http ---------- */
(async () => {
  render();
  const q = new URLSearchParams(location.search).get("manifest");
  if (location.protocol.startsWith("http")) await favLoad();
  if (q) await loadManifest(q);
  else if (location.protocol.startsWith("http")) { if (!(await loadManifest("manifest.json"))) say("Drop WAV files to analyse them."); }
  else say("Drop WAV files to analyse them.");
})();
</script>
</body>
