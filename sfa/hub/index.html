<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFA Console</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22sfaG%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23a06bff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236226f5%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22url%28%23sfaG%29%22/%3E%3Cpath%20d%3D%22M22.5%209.75H14.25a3.25%203.25%200%200%200%200%206.5h3.5a3.25%203.25%200%200%201%200%206.5H13%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%228.6%22%20cy%3D%2222.75%22%20r%3D%222.1%22%20fill%3D%22%23ff2e7e%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="/hub/hub.css">
</head>
<body>
<header class="top">
  <a class="mark" href="#units" aria-label="SFA Console, home">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="sfaG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a06bff"/><stop offset="1" stop-color="#6226f5"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#sfaG)"/><path d="M22.5 9.75H14.25a3.25 3.25 0 0 0 0 6.5h3.5a3.25 3.25 0 0 1 0 6.5H13" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="22.75" r="2.1" fill="#ff2e7e"/></svg>
    <div><b>SFA</b><span>Console</span></div>
  </a>
  <div class="crumb" id="crumb"></div>
  <span class="sp"></span>
  <button id="themeBtn" class="sm" title="Switch between the dark and light theme">Dark</button>
  <div class="live" id="live"><i></i><span id="liveTxt">connecting</span></div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Tools">
    <div class="grp">Workshop</div>
    <a href="#units" data-p="units">Units</a>
    <a href="#analyzer" data-p="analyzer">Analyzer</a>
    <a href="#samplelab" data-p="samplelab">Sample Lab</a>
    <a href="#presets" data-p="presets">Presets</a>
    <div class="grp">Prototype</div>
    <a href="#designer" data-p="designer">Designer</a>
    <a href="#planner" data-p="planner">Planner</a>
    <a href="#agents" data-p="agents">Agents</a>
    <span class="sp"></span>
    <a href="#more" data-p="more" class="quiet">More</a>
  </nav>
  <main id="main"></main>
</div>

<script>
"use strict";
document.addEventListener("DOMContentLoaded", () => initTheme());
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = (v, d = 1) => (v === null || v === undefined || !isFinite(v)) ? "-" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const NOTE = { sim: "Builds the simulator and runs every check. Needs no hardware.", render: "Plays a chained song and the full test suite through the simulator and keeps the WAVs.", report: "Measures the latest renders: peak, true peak, LUFS, clicks.", up: "Checks, renders, measures. Stops if anything is flagged.", flash: "Builds the package and installs it on the unit that is on USB." };
let S = null, busy = false, outText = "", outTitle = "output";

async function api(path, opt) { const r = await fetch(path, opt); if (!r.ok) throw new Error(await r.text()); return r; }
async function refresh() {
  try { S = await (await api("/api/state")).json(); $("#live").classList.remove("off"); $("#liveTxt").textContent = "connected · " + S.when; }
  catch (e) { $("#live").classList.add("off"); $("#liveTxt").textContent = "console server not reachable"; }
}
async function run(cmd, unit, args) {
  if (busy) return; busy = true; outText = ""; outTitle = cmd + (unit ? " " + unit : ""); setBusy(true); updOut();
  try {
    const r = await fetch("/api/run?cmd=" + cmd + "&unit=" + (unit || "") + "&args=" + encodeURIComponent((args || []).join(" ")), { method: "POST", headers: { "X-SFA": "1" } });
    if (!r.ok) { outText = await r.text(); }
    else { const rd = r.body.getReader(), dec = new TextDecoder(); for (;;) { const { done, value } = await rd.read(); if (done) break; outText += dec.decode(value, { stream: true }).replace(/\x1b\[[0-9;]*m/g, ""); updOut(); } }
  } catch (e) { outText += "\n" + e.message; }
  { const m = /\[exit (-?\d+)\]\s*$/.exec(outText); lastRun = { cmd, unit, args: args || [], code: m ? +m[1] : null }; }
  busy = false; updOut(); await refresh(); if (page() === "units") { await checkUsb(); renderUnits(true); } setBusy(false);
}
function setBusy(b) { document.querySelectorAll("[data-run]").forEach(x => x.disabled = b); }
function updOut() { const p = $("#outPre"); if (!p) return; $("#outTitle").textContent = (busy ? "running: " : "last run: ") + outTitle; p.textContent = outText || "Nothing run yet."; p.scrollTop = p.scrollHeight; const w = $("#termWrap"); if (w && busy) w.open = true; }

const page = () => (location.hash || "#units").slice(1) || "units";
function route() {
  const p = page(); let grp = "", name = "";
  document.querySelectorAll("nav.rail > *").forEach(a => { if (a.classList.contains("grp")) { if (!name) grp = a.textContent; } else if (a.dataset.p === p || (p === "layouts" && a.dataset.p === "designer")) { name = [...a.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join("").trim(); a.classList.add("on"); } else a.classList.remove("on"); });
  if (!name && p !== "units") { const m = document.querySelector('nav.rail a[data-p="more"]'); if (m) m.classList.add("on"); const hit = MORE.find(x => x[0] === p); grp = "More"; name = hit ? hit[1] : ""; }
  { const c = $("#crumb"); if (p === "more") grp = ""; if (c) c.innerHTML = name ? (grp ? esc(grp) + " <i>/</i> " : "") + "<b>" + esc(name) + "</b>" : ""; document.title = (name ? name + " \u00b7 " : "") + "SFA Console"; }
  ({ units: viewUnits, analyzer: viewAnalyzer, samplelab: viewLab, more: viewMore, planner: viewPlanner, decisions: viewDecisions, arch: viewArch, docs: viewDocs, engines: viewEngines, presets: viewPresets, compare: viewCompare, prototype: viewProto, doctor: viewDoctor, log: viewLog, roadmap: viewRoadmap }[p] || (window.WS && WS[p]) || viewUnits)();
}
window.addEventListener("hashchange", route);
/* nav icons: one small geometric glyph per page */
const ICONS = { more: '<circle cx="3" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/>', units: '<rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6 1.5v2.5M10 1.5v2.5M6 12v2.5M10 12v2.5M1.5 6h2.5M1.5 10h2.5M12 6h2.5M12 10h2.5"/>', analyzer: '<path d="M2 9V7M5 12V4M8 14V2M11 11V5M14 9V7"/>', samplelab: '<path d="M1.5 11c1-4 2-6 3-6s1.5 6 3 6 2-8 3-8 1.5 5 4 5"/><path d="M8 1.5v13" stroke-dasharray="2 2"/>', presets: '<path d="M2 2h5.5L14 8.5 8.5 14 2 7.5z"/><circle cx="5.2" cy="5.2" r="1"/>', patterns: '<rect x="2" y="2" width="4" height="4" rx="1"/><rect x="10" y="2" width="4" height="4" rx="1"/><rect x="2" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/>', toolbox: '<path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.6" fill="currentColor"/><circle cx="11" cy="8" r="1.6" fill="currentColor"/><circle cx="7" cy="12" r="1.6" fill="currentColor"/>', agents: '<path d="M2.5 3h11v7.5H8L4.5 13.5v-3h-2z"/>', direction: '<circle cx="8" cy="8" r="6"/><path d="M10.5 5.5 9 9l-3.5 1.5L7 7z"/>', designer: '<path d="M2 14 14 2M2 14v-4M2 14h4"/><rect x="8.5" y="8.5" width="5.5" height="5.5" rx="1"/>', planner: '<path d="M5.5 4H14M5.5 8H14M5.5 12H14"/><circle cx="2.5" cy="4" r=".9" fill="currentColor"/><circle cx="2.5" cy="8" r=".9" fill="currentColor"/><circle cx="2.5" cy="12" r=".9" fill="currentColor"/>', decisions: '<circle cx="8" cy="8" r="6"/><path d="m5.2 8.2 2 2 3.6-4"/>', engines: '<rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><path d="M11.5 9v5M9 11.5h5"/>', arch: '<path d="m8 2 6 3-6 3-6-3zM2 8l6 3 6-3M2 11l6 3 6-3"/>', compare: '<rect x="2" y="3" width="5" height="10" rx="1"/><rect x="9" y="3" width="5" height="10" rx="1"/>', prototype: '<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/>', docs: '<path d="M4 2h5.5L13 5.5V14H4zM9.5 2v3.5H13M6.5 8.5h4M6.5 11h4"/>', doctor: '<path d="M1.5 8h3l1.5-4 3 8 1.5-4h4"/>', log: '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>', roadmap: '<path d="M3.5 14V2.5M3.5 3h8l-2 2.75 2 2.75h-8"/>' };
document.querySelectorAll("nav.rail a").forEach(a => { if (ICONS[a.dataset.p]) a.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 16 16" aria-hidden="true">' + ICONS[a.dataset.p] + "</svg>"); });

/* ---- units ---- */
function pills(files) { const c = { clean: 0, watch: 0, flag: 0 }; files.forEach(f => c[f.verdict] = (c[f.verdict] || 0) + 1); return ["clean", "watch", "flag"].filter(k => c[k]).map(k => '<span class="pill ' + k + '">' + c[k] + " " + k + "</span>").join(" ") || '<span class="pill none">no files</span>'; }
function viewUnits() {
  $("#main").innerHTML = '<h1>Units</h1><p class="lede">Check, then flash one FM-1 at a time.</p><div class="usb" id="usb"><b>On USB</b><span id="usbTxt" style="flex:1;min-width:200px">not checked</span><button id="usbBtn" class="sm">Check again</button></div><div class="cards" id="cards"></div><details class="termwrap" id="termWrap"><summary>Output of the last run</summary><div class="term"><header><span id="outTitle">output</span></header><pre id="outPre"></pre></div></details>';
  renderUnits(); updOut(); $("#usbBtn").onclick = () => checkUsb().then(renderUnitSteps); checkUsb().then(renderUnitSteps);
}
let usb = null;
async function checkUsb() {
  const box = $("#usb"), txt = $("#usbTxt"); if (!box) return; txt.textContent = "looking..."; box.className = "usb";
  try { usb = await (await api("/api/ports")).json(); } catch (e) { usb = { error: e.message }; }
  if (usb.error) { txt.textContent = "Cannot look at USB from here (" + usb.error + "). Flash will still be checked by the installer."; return usb; }
  const n = usb.found.length;
  txt.innerHTML = n === 1 ? '<span class="q">1 FM-1</span> running <b>' + esc(unitName(usb.found[0]) ) + "</b>. Ready to flash one." : n === 0 ? 'No FM-1 answered.' + (usb.busy.length ? " A port is busy: close the mirror tab or any MIDI program (" + esc(usb.busy.join(", ")) + ")." : " Plug in the unit you want to flash.") : '<b style="color:var(--bad)">' + n + " FM-1s on USB</b> (" + usb.found.map(f => esc(f.firmware || "?")).join(", ") + "). Unplug all but one.";
  box.className = "usb " + (n === 1 ? "good" : "bad"); return usb;
}
const unitName = f => { const u = S && S.units.find(x => x.id === f.unit); return u ? u.name : "firmware " + (f.firmware || "?"); };
let lastRun = null, mirrorOk = false;
function unitSteps(u) {
  const r = u.render, files = r ? r.files : [], flag = files.filter(f => f.verdict === "flag").length, watch = files.filter(f => f.verdict === "watch").length, n = u.notes;
  const onUsb = usb && usb.found ? usb.found.filter(f => f.unit === u.id).length : -1, tot = usb && usb.found ? usb.found.length : -1;
  const st = (cls, label, txt) => '<div class="step ' + cls + '"><b>' + label.replace(/^(\d) /, "$1 · ") + "</b><span title=\"" + esc(txt) + '">' + esc(txt) + "</span></div>";
  return '<div class="steps">' +
    st(u.sim ? "done" : "", "1 Simulate", u.sim ? "built " + String(u.sim).replace(/\s+\d\d:\d\d$/, "") : "not built yet") +
    st(!r ? "" : flag ? "bad" : watch ? "warn" : "done", "2 Measure", !r ? "no renders yet" : flag ? flag + " flagged" : watch ? watch + " to watch" : files.length + " clean") +
    st(tot < 0 ? "" : tot === 1 && onUsb === 1 ? "done" : tot === 1 ? "warn" : tot === 0 ? "" : "bad", "3 On USB", tot < 0 ? "not checked" : tot === 0 ? "not plugged in" : tot > 1 ? tot + " units: unplug" : onUsb === 1 ? "this unit, alone" : "another firmware") +
    st(n ? "done" : "", "4 Flashed", n ? String(n.build).replace(/^[A-Za-z]+\s+/, "") + " · " + String(n.date).slice(5) : "not logged") + "</div>";
}
function renderUnits() {
  const el = $("#cards"); if (!el) return;
  if (!S) { el.innerHTML = '<div class="card">Waiting for the console server...</div>'; return; }
  el.innerHTML = (S.online ? '<div class="note warn" style="grid-column:1/-1">This is the online console. Simulating, rendering, flashing and USB are off here; do those on your own machine with <span class="mono">tools/sfa console</span>.</div>' : "") + S.units.map(u => {
    const r = u.render, files = r ? r.files : [], n = u.notes, flag = files.some(f => f.verdict === "flag");
    let after = "";
    if (lastRun && lastRun.unit === u.id && !busy) {
      if (lastRun.cmd === "up" && !lastRun.args.includes("--no-flash")) after = lastRun.code === 0 ? '<div class="note good"><b>Flash finished.</b> Play the unit, then log it so the build is on record.<div class="row" style="margin:8px 0 0"><span>Build</span><input type="number" id="fl-b-' + u.id + '" value="' + ((n && +String(n.build).replace(/\D+/g, "") || 0) + 1) + '" style="width:80px"><input id="fl-n-' + u.id + '" placeholder="What changed, how it sounds" style="flex:1;min-width:200px"><button class="tool" data-flog="' + u.id + '">Log this flash</button></div></div>' : '<div class="note bad"><b>Stopped before the flash finished</b> (exit ' + lastRun.code + "). Read the output below; nothing is logged.</div>";
      else if (lastRun.code !== 0 && lastRun.code != null) after = '<div class="note warn"><b>' + esc(lastRun.cmd) + "</b> ended with exit " + lastRun.code + ". The output below says why.</div>";
      else if (lastRun.cmd === "up") after = '<div class="note good"><b>Checked.</b> ' + (flag ? "Something is flagged: open the Analyzer before flashing." : "Renders measured clean. Ready to flash when the unit is on USB.") + "</div>";
    }
    const onU = usb && usb.found ? usb.found.filter(f => f.unit === u.id).length === 1 && usb.found.length === 1 : false;
    const stt = flag ? ["flag", "Flagged"] : !u.sim || !files.length ? ["none", "Not checked"] : files.some(f => f.verdict === "watch") ? ["watch", "Checked, with notes"] : onU ? ["go", "Ready to flash"] : ["info", "Checked"];
    const tot = usb && usb.found ? usb.found.length : -1, justFlashed = lastRun && lastRun.unit === u.id && lastRun.cmd === "up" && !lastRun.args.includes("--no-flash") && lastRun.code === 0;
    const nx = busy ? ["", "Working…", "A run is in progress. Its output is below.", ""] : justFlashed ? ["okn", "Next", "Play the unit, then log the flash below.", ""] : !u.sim || !files.length ? ["", "Next", "Run the checks: it builds the simulator, renders and measures.", '<button class="primary sm" data-run data-c="up" data-a="--no-flash">Check all</button>'] : flag ? ["hotn", "Fix first", "A render is flagged. Look at it before anything is flashed.", '<a href="#analyzer" data-an="' + u.id + '"><button class="sm">Open the Analyzer</button></a>'] : tot > 1 ? ["hotn", "Unplug", tot + " FM-1s are on USB. Leave only the one you want to flash.", '<button class="sm" data-usb>Check again</button>'] : tot === 0 ? ["", "Next", "Plug in this unit (and only this unit), then check USB.", '<button class="sm" data-usb>Check USB</button>'] : tot === 1 && !onU ? ["hotn", "Careful", "The FM-1 on USB runs another firmware. Flashing will replace it with " + u.name + ".", '<button class="hot sm" data-run data-flash="' + u.id + '">Flash anyway…</button>'] : onU ? ["okn", "Ready", "Checked and alone on USB. Close the mirror tabs and flash.", '<button class="hot sm" data-run data-flash="' + u.id + '">Flash…</button>'] : ["", "Next", "Checked. USB could not be read from here; the installer checks when you flash.", ""];
    const nextBar = '<div class="next ' + nx[0] + '"><span>' + nx[1] + "</span><b>" + nx[2] + "</b>" + nx[3] + "</div>";
    return '<section class="card" data-u="' + u.id + '"><div><span class="eyebrow" style="color:var(--dim)">' + esc(u.hardware) + '</span><h2>' + esc(u.name) + '<span class="pill ' + stt[0] + '">' + stt[1] + '</span></h2></div>' + nextBar + unitSteps(u) +
      '<div class="actions"><button class="primary" data-run data-c="up" data-a="--no-flash" title="' + NOTE.up + '">Check all</button><a href="#analyzer" data-an="' + u.id + '"><button>Open in Analyzer</button></a><span class="sp"></span><button class="hot" data-run data-flash="' + u.id + '">Flash…</button></div><div data-confirm></div>' + after +
      '<details><summary>Details and single steps</summary><div class="chips" style="margin-bottom:10px">' + u.engines.map(e => '<span class="chip">' + esc(e) + "</span>").join("") + '</div><dl style="border-top:0;padding-top:0"><dt>Package</dt><dd>' + (u.package ? esc(u.package.name) + " · " + esc(u.package.at) : "none built here") + "</dd><dt>Renders</dt><dd>" + (r ? esc(r.stamp) + " &nbsp; " + pills(files) : "none yet") + "</dd><dt>Latest build</dt><dd>" + (n ? esc(n.date) + " · " + esc(n.build) + '<br><span class="hint">' + esc(n.what) + "</span>" : "not in the flash log") + '</dd></dl><div class="actions" style="margin-top:12px"><button class="sm" data-run data-c="sim" title="' + NOTE.sim + '">Sim</button><button class="sm" data-run data-c="render" title="' + NOTE.render + '">Render</button><button class="sm" data-run data-c="report" title="' + NOTE.report + '">Report</button></div></details>' +
      (files.length ? '<details><summary>Latest renders (' + files.length + ')</summary><div class="tw"><table><tr><th>file</th><th>TP</th><th>LUFS</th><th>clicks</th><th></th></tr>' + files.map(f => "<tr><td>" + esc(f.file) + "</td><td>" + f1(f.tp) + "</td><td>" + f1(f.lufs) + "</td><td>" + f.clicks + '</td><td><span class="pill ' + f.verdict + '">' + f.verdict + "</span></td></tr>").join("") + "</table></div></details>" : "") + "</section>";
  }).join("");
  setBusy(busy);
}
document.addEventListener("click", e => { if (e.target.closest("[data-usb]")) checkUsb().then(renderUnitSteps); });
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-flog]"); if (!b) return; const id = b.dataset.flog;
  try { await api("/api/flashlog", { method: "POST", headers: { "X-SFA": "1" }, body: JSON.stringify({ unit: id, build: +$("#fl-b-" + id).value, note: $("#fl-n-" + id).value }) }); lastRun = null; await refresh(); renderUnits(); }
  catch (x) { b.parentElement.insertAdjacentHTML("afterend", '<div class="hint" style="color:var(--bad)">Not logged: ' + esc(x.message) + "</div>"); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"), card = e.target.closest("[data-u]");
  if (b && b.dataset.c && card) run(b.dataset.c, card.dataset.u, b.dataset.a ? [b.dataset.a] : []);
  else if (b && b.dataset.flash) { flashAsk(b.dataset.flash, card); }
  else if (false) { const c = card.querySelector("[data-confirm]"); c.innerHTML = '<div class="confirm"><span>Flash <b>' + esc(S.units.find(u => u.id === b.dataset.flash).name) + '</b> now? Only this unit on USB, mirror tabs closed.</span><button class="danger" data-go="' + b.dataset.flash + '">Flash it</button><button data-no>Cancel</button></div>'; }
  else if (b && b.dataset.go) { card.querySelector("[data-confirm]").innerHTML = ""; run("up", b.dataset.go, []); }
  else if (b && "no" in b.dataset) card.querySelector("[data-confirm]").innerHTML = "";
  else if (e.target.closest("[data-an]")) anUnits = e.target.closest("[data-an]").dataset.an;
});
async function flashAsk(id, card) {
  const c = card.querySelector("[data-confirm]"), u = S.units.find(x => x.id === id), name = u.name; c.innerHTML = '<div class="confirm">Checking USB...</div>';
  const d = await checkUsb(), n = d && d.found ? d.found.length : -1; renderUnitSteps();
  const c2 = document.querySelector('[data-u="' + id + '"] [data-confirm]'); if (!c2) return;
  const files = u.render ? u.render.files : [], flag = files.filter(f => f.verdict === "flag").length;

function md(src) {

  const L = src.replace(/\r/g, "").split("\n"); let o = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { let b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; o += "<pre>" + esc(b.join("\n")) + "</pre>"; continue; }
    let m;
    if ((m = /^(#{1,4})\s+(.*)/.exec(l))) { o += "<h" + m[1].length + ">" + inl(m[2]) + "</h" + m[1].length + ">"; i++; continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(L[i + 1] || "")) { const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()); let t = "<div class=\"tw\"><table><tr>" + row(l).map(c => "<th>" + inl(c) + "</th>").join("") + "</tr>"; i += 2; while (i < L.length && /^\|.*\|\s*$/.test(L[i])) t += "<tr>" + row(L[i++]).map(c => "<td>" + inl(c) + "</td>").join("") + "</tr>"; o += t + "</table></div>"; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ord = /^\s*\d+\./.test(l); let t = ord ? "<ol>" : "<ul>"; while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) { let it = L[i].replace(/^\s*([-*]|\d+\.)\s+/, ""); i++; while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*]|\d+\.)\s+/.test(L[i])) it += " " + L[i++].trim(); t += "<li>" + inl(it) + "</li>"; } o += t + (ord ? "</ol>" : "</ul>"); continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    let p = []; while (i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,4}\s|```|\s*([-*]|\d+\.)\s+|\|)/.test(L[i])) p.push(L[i++]); o += "<p>" + inl(p.join(" ")) + "</p>";
  }

}

  document.querySelectorAll("[data-ddel]").forEach(b => b.onclick = () => { D.splice(+b.dataset.ddel, 1); psave(); drawDecisions(); });
  $("#addD").onclick = () => { const t = $("#newD").value.trim(); if (t) { D.push({ id: "d" + Date.now(), title: t, status: "open", why: "", date: "" }); psave(); drawDecisions(); } };
}
/* ---- preset export / import (sfa-presets/1: tags and notes only, until the pack format exists) ---- */
function exportPresets() {
  const data = { schema: "sfa-presets/1", exported: new Date().toISOString(), presets: P.presets || {}, notes: P.presetNotes || "" };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" })); a.download = "sfa-presets.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importPresets(file) {
  try {
    const d = JSON.parse(await file.text()); if (d.schema !== "sfa-presets/1" || typeof d.presets !== "object") throw new Error("not an sfa-presets/1 file");
    const keys = Object.keys(d.presets).filter(k => /^(ecb|as)\|[\w]+\|[^|]{1,40}$/.test(k)); if (!keys.length) throw new Error("no usable entries");
    if (!confirm("Merge " + keys.length + " entries into your tags and notes? Existing tags are kept and combined.")) return;
    P.presets = P.presets || {}; keys.forEach(k => { const s = d.presets[k] || {}, t = P.presets[k] = P.presets[k] || {}; t.tags = [...new Set([...(t.tags || []), ...(Array.isArray(s.tags) ? s.tags.filter(x => typeof x === "string").slice(0, 8) : [])])]; if (typeof s.note === "string" && s.note && !t.note) t.note = s.note.slice(0, 300); if (+s.stars >= 1 && +s.stars <= 5 && !t.stars) t.stars = Math.round(+s.stars); });
    psave(); drawPresets();
  } catch (e) { alert("Import failed: " + e.message); }
}

function initTheme() { let t = "dark"; try { t = localStorage.getItem("sfa-theme2") === "light" ? "light" : "dark"; } catch (e) {} applyTheme(t); $("#themeBtn").onclick = () => { applyTheme(THEME === "dark" ? "light" : "dark"); try { localStorage.setItem("sfa-theme2", THEME); } catch (e) {} }; }
document.addEventListener("load", e => { if (e.target && e.target.classList && e.target.classList.contains("frame")) { try { e.target.contentWindow.postMessage({ sfaTheme: THEME }, location.origin); } catch (x) {} } }, true);
