<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFA Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="/hub/hub.css">
</head>
<body>
<header class="top">
  <a class="mark" href="#units">
    <svg width="32" height="32" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="var(--accent)"/><g fill="var(--accent-fg)"><rect x="5" y="15" width="3" height="10" rx="1"/><rect x="10" y="8" width="3" height="17" rx="1"/><rect x="15" y="12" width="3" height="13" rx="1"/><rect x="20" y="5" width="3" height="20" rx="1"/></g></svg>
    <div><b>SFA</b> <span>Console</span></div>
  </a>
  <span class="sp"></span>
  <button id="themeBtn" class="sm" title="Colour theme: light or dark">Light</button>
  <div class="live" id="live"><i></i><span id="liveTxt">connecting</span></div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Tools">
    <div class="grp">Workshop</div>
    <a href="#units" data-p="units">Units <small>flash</small></a>
    <a href="#analyzer" data-p="analyzer">Analyzer <small>ears</small></a>
    <a href="#samplelab" data-p="samplelab">Sample Lab <small>chop</small></a>
    <a href="#presets" data-p="presets">Presets <small>tags</small></a>
    <a href="#patterns" data-p="patterns">Patterns <small>sketch</small></a>
    <a href="#toolbox" data-p="toolbox">Toolbox <small>calc</small></a>
    <div class="grp">Prototype</div>
    <a href="#direction" data-p="direction">Direction <small>brief</small></a>
    <a href="#layouts" data-p="layouts">Layouts <small>form</small></a>
    <a href="#planner" data-p="planner">Planner <small>specs</small></a>
    <a href="#decisions" data-p="decisions">Decisions <small>log</small></a>
    <a href="#engines" data-p="engines">Engine map <small>scope</small></a>
    <a href="#arch" data-p="arch">Architecture <small>design</small></a>
    <a href="#compare" data-p="compare">Compare <small>board</small></a>
    <a href="#prototype" data-p="prototype">Research <small>parts</small></a>
    <div class="grp">System</div>
    <a href="#docs" data-p="docs">Docs <small>changelog</small></a>
    <a href="#doctor" data-p="doctor">Doctor</a>
    <a href="#log" data-p="log">Flash log</a>
    <a href="#roadmap" data-p="roadmap">Roadmap</a>
  </nav>
  <main id="main"></main>
</div>

<script>
"use strict";
document.addEventListener("DOMContentLoaded", () => initTheme());
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = (v, d = 1) => (v === null || v === undefined || !isFinite(v)) ? "-" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const NOTE = { sim: "Builds the simulator and runs every check. Needs no hardware.", render: "Plays a chained song and the full test suite through the simulator and keeps the WAVs.", report: "Measures the latest renders: peak, true peak, LUFS, clicks.", up: "Checks, renders, measures. Stops if anything is flagged.", flash: "Builds the package and installs it on the unit that is on USB." };
let S = null, busy = false, outText = "", outTitle = "output";

async function api(path, opt) { const r = await fetch(path, opt); if (!r.ok) throw new Error(await r.text()); return r; }
async function refresh() {
  try { S = await (await api("/api/state")).json(); $("#live").classList.remove("off"); $("#liveTxt").textContent = "connected · " + S.when; }
  catch (e) { $("#live").classList.add("off"); $("#liveTxt").textContent = "console server not reachable"; }
}
async function run(cmd, unit, args) {
  if (busy) return; busy = true; outText = ""; outTitle = cmd + (unit ? " " + unit : ""); setBusy(true); updOut();
  try {
    const r = await fetch("/api/run?cmd=" + cmd + "&unit=" + (unit || "") + "&args=" + encodeURIComponent((args || []).join(" ")), { method: "POST", headers: { "X-SFA": "1" } });
    if (!r.ok) { outText = await r.text(); }
    else { const rd = r.body.getReader(), dec = new TextDecoder(); for (;;) { const { done, value } = await rd.read(); if (done) break; outText += dec.decode(value, { stream: true }).replace(/\x1b\[[0-9;]*m/g, ""); updOut(); } }
  } catch (e) { outText += "\n" + e.message; }
  { const m = /\[exit (-?\d+)\]\s*$/.exec(outText); lastRun = { cmd, unit, args: args || [], code: m ? +m[1] : null }; }
  busy = false; updOut(); await refresh(); if (page() === "units") { await checkUsb(); renderUnits(true); } setBusy(false);
}
function setBusy(b) { document.querySelectorAll("[data-run]").forEach(x => x.disabled = b); }
function updOut() { const p = $("#outPre"); if (!p) return; $("#outTitle").textContent = (busy ? "running: " : "last run: ") + outTitle; p.textContent = outText || "Nothing run yet. Pick a button on a unit."; p.scrollTop = p.scrollHeight; }

const page = () => (location.hash || "#units").slice(1) || "units";
function route() {
  const p = page(); document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.p === p));
  ({ units: viewUnits, analyzer: viewAnalyzer, samplelab: viewLab, planner: viewPlanner, decisions: viewDecisions, arch: viewArch, docs: viewDocs, engines: viewEngines, presets: viewPresets, compare: viewCompare, prototype: viewProto, doctor: viewDoctor, log: viewLog, roadmap: viewRoadmap }[p] || (window.WS && WS[p]) || viewUnits)();
}
window.addEventListener("hashchange", route);

/* ---- units ---- */
function pills(files) { const c = { clean: 0, watch: 0, flag: 0 }; files.forEach(f => c[f.verdict] = (c[f.verdict] || 0) + 1); return ["clean", "watch", "flag"].filter(k => c[k]).map(k => '<span class="pill ' + k + '">' + c[k] + " " + k + "</span>").join(" ") || '<span class="pill none">no files</span>'; }
function viewUnits() {
  $("#main").innerHTML = '<h1>Units</h1><p class="lede">Each unit is a firmware on its own FM-1. Work left to right: simulate, measure, put one unit on USB, flash, log it. The flash button checks USB first and will not go ahead with zero or two units.</p><div class="usb" id="usb"><b>On USB now</b><span id="usbTxt" style="flex:1;min-width:200px">not checked</span><button id="usbBtn">Check</button></div><div class="cards" id="cards"></div><div class="term"><header><span id="outTitle">output</span></header><pre id="outPre"></pre></div>';
  renderUnits(); updOut(); $("#usbBtn").onclick = () => checkUsb().then(renderUnitSteps); checkUsb().then(renderUnitSteps);
}
let usb = null;
async function checkUsb() {
  const box = $("#usb"), txt = $("#usbTxt"); if (!box) return; txt.textContent = "looking..."; box.className = "usb";
  try { usb = await (await api("/api/ports")).json(); } catch (e) { usb = { error: e.message }; }
  if (usb.error) { txt.textContent = "Cannot look at USB from here (" + usb.error + "). Flash will still be checked by the installer."; return usb; }
  const n = usb.found.length;
  txt.innerHTML = n === 1 ? '<span class="q">1 FM-1</span> running <b>' + esc(unitName(usb.found[0]) ) + "</b>. Ready to flash one." : n === 0 ? 'No FM-1 answered.' + (usb.busy.length ? " A port is busy: close the mirror tab or any MIDI program (" + esc(usb.busy.join(", ")) + ")." : " Plug in the unit you want to flash.") : '<b style="color:var(--bad)">' + n + " FM-1s on USB</b> (" + usb.found.map(f => esc(f.firmware || "?")).join(", ") + "). Unplug all but one.";
  box.className = "usb " + (n === 1 ? "good" : "bad"); return usb;
}
const unitName = f => { const u = S && S.units.find(x => x.id === f.unit); return u ? u.name : "firmware " + (f.firmware || "?"); };
let lastRun = null, mirrorOk = false;
function unitSteps(u) {
  const r = u.render, files = r ? r.files : [], flag = files.filter(f => f.verdict === "flag").length, watch = files.filter(f => f.verdict === "watch").length, n = u.notes;
  const onUsb = usb && usb.found ? usb.found.filter(f => f.unit === u.id).length : -1, tot = usb && usb.found ? usb.found.length : -1;
  const st = (cls, label, txt) => '<div class="step ' + cls + '"><b>' + label + "</b><span title=\"" + esc(txt) + '">' + esc(txt) + "</span></div>";
  return '<div class="steps">' +
    st(u.sim ? "done" : "", "1 Simulate", u.sim ? "built " + u.sim : "not built yet") +
    st(!r ? "" : flag ? "bad" : watch ? "warn" : "done", "2 Measure", !r ? "no renders yet" : flag ? flag + " flagged" : watch ? watch + " to watch" : files.length + " clean") +
    st(tot < 0 ? "" : tot === 1 && onUsb === 1 ? "done" : tot === 1 ? "warn" : tot === 0 ? "" : "bad", "3 On USB", tot < 0 ? "not checked" : tot === 0 ? "not plugged in" : tot > 1 ? tot + " units: unplug" : onUsb === 1 ? "this unit, alone" : "another firmware") +
    st(n ? "done" : "", "4 Flashed", n ? n.build + " · " + n.date : "not logged") + "</div>";
}
function renderUnits() {
  const el = $("#cards"); if (!el) return;
  if (!S) { el.innerHTML = '<div class="card">Waiting for the console server...</div>'; return; }
  el.innerHTML = S.units.map(u => {
    const r = u.render, files = r ? r.files : [], n = u.notes, flag = files.some(f => f.verdict === "flag");
    let after = "";
    if (lastRun && lastRun.unit === u.id && !busy) {
      if (lastRun.cmd === "up" && !lastRun.args.includes("--no-flash")) after = lastRun.code === 0 ? '<div class="note good"><b>Flash finished.</b> Play the unit, then log it so the build is on record.<div class="row" style="margin:8px 0 0"><span>Build</span><input type="number" id="fl-b-' + u.id + '" value="' + ((n && +String(n.build).replace(/\D+/g, "") || 0) + 1) + '" style="width:80px"><input id="fl-n-' + u.id + '" placeholder="What changed, how it sounds" style="flex:1;min-width:200px"><button class="tool" data-flog="' + u.id + '">Log this flash</button></div></div>' : '<div class="note bad"><b>Stopped before the flash finished</b> (exit ' + lastRun.code + "). Read the output below; nothing is logged.</div>";
      else if (lastRun.code !== 0 && lastRun.code != null) after = '<div class="note warn"><b>' + esc(lastRun.cmd) + "</b> ended with exit " + lastRun.code + ". The output below says why.</div>";
      else if (lastRun.cmd === "up") after = '<div class="note good"><b>Checked.</b> ' + (flag ? "Something is flagged: open the Analyzer before flashing." : "Renders measured clean. Ready to flash when the unit is on USB.") + "</div>";
    }
    return '<section class="card" data-u="' + u.id + '"><h2>' + esc(u.name) + "<small>" + esc(u.hardware) + '</small></h2><div class="chips">' + u.engines.map(e => '<span class="chip">' + esc(e) + "</span>").join("") + "</div>" + unitSteps(u) +
      "<dl><dt>Package</dt><dd>" + (u.package ? esc(u.package.name) + " · " + esc(u.package.at) : "none built here") + "</dd>" +
      "<dt>Renders</dt><dd>" + (r ? esc(r.stamp) + " &nbsp; " + pills(files) : "none yet") + "</dd><dt>Latest build</dt><dd>" + (n ? esc(n.date) + " · " + esc(n.build) + '<br><span class="hint">' + esc(n.what) + "</span>" : "not in the flash log") + "</dd></dl>" +
      '<div class="actions"><button class="tool" data-run data-c="up" data-a="--no-flash" title="' + NOTE.up + '">Check all</button><button data-run data-c="sim" title="' + NOTE.sim + '">Sim</button><button data-run data-c="render" title="' + NOTE.render + '">Render</button><button data-run data-c="report" title="' + NOTE.report + '">Report</button><a href="#analyzer" data-an="' + u.id + '"><button>Analyzer</button></a><span class="sp"></span><button class="primary" data-run data-flash="' + u.id + '">Flash…</button></div><div data-confirm></div>' + after +
      (files.length ? '<details><summary>Latest renders (' + files.length + ')</summary><div class="tw"><table><tr><th>file</th><th>TP</th><th>LUFS</th><th>clicks</th><th></th></tr>' + files.map(f => "<tr><td>" + esc(f.file) + "</td><td>" + f1(f.tp) + "</td><td>" + f1(f.lufs) + "</td><td>" + f.clicks + '</td><td><span class="pill ' + f.verdict + '">' + f.verdict + "</span></td></tr>").join("") + "</table></div></details>" : "") + "</section>";
  }).join("");
  setBusy(busy);
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-flog]"); if (!b) return; const id = b.dataset.flog;
  try { await api("/api/flashlog", { method: "POST", headers: { "X-SFA": "1" }, body: JSON.stringify({ unit: id, build: +$("#fl-b-" + id).value, note: $("#fl-n-" + id).value }) }); lastRun = null; await refresh(); renderUnits(); }
  catch (x) { b.parentElement.insertAdjacentHTML("afterend", '<div class="hint" style="color:var(--bad)">Not logged: ' + esc(x.message) + "</div>"); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"), card = e.target.closest("[data-u]");
  if (b && b.dataset.c && card) run(b.dataset.c, card.dataset.u, b.dataset.a ? [b.dataset.a] : []);
  else if (b && b.dataset.flash) { flashAsk(b.dataset.flash, card); }
  else if (false) { const c = card.querySelector("[data-confirm]"); c.innerHTML = '<div class="confirm"><span>Flash <b>' + esc(S.units.find(u => u.id === b.dataset.flash).name) + '</b> now? Only this unit on USB, mirror tabs closed.</span><button class="danger" data-go="' + b.dataset.flash + '">Flash it</button><button data-no>Cancel</button></div>'; }
  else if (b && b.dataset.go) { card.querySelector("[data-confirm]").innerHTML = ""; run("up", b.dataset.go, []); }
  else if (b && "no" in b.dataset) card.querySelector("[data-confirm]").innerHTML = "";
  else if (e.target.closest("[data-an]")) anUnits = e.target.closest("[data-an]").dataset.an;
});
async function flashAsk(id, card) {
  const c = card.querySelector("[data-confirm]"), u = S.units.find(x => x.id === id), name = u.name; c.innerHTML = '<div class="confirm">Checking USB...</div>';
  const d = await checkUsb(), n = d && d.found ? d.found.length : -1; renderUnitSteps();
  const c2 = document.querySelector('[data-u="' + id + '"] [data-confirm]'); if (!c2) return;
  const files = u.render ? u.render.files : [], flag = files.filter(f => f.verdict === "flag").length;
  const li = (ok, t) => '<div style="display:flex;gap:8px;align-items:baseline"><b style="color:var(--' + (ok === true ? "good" : ok === false ? "bad" : "warn") + ')">' + (ok === true ? "✓" : ok === false ? "✗" : "!") + "</b><span>" + t + "</span></div>";
  const usbLine = n === 1 ? li(true, "One FM-1 on USB, running <b>" + esc(unitName(d.found[0])) + "</b>. " + (unitName(d.found[0]) === name ? "It will be re-flashed with the new build." : "It will become <b>" + esc(name) + "</b>.")) : n === 0 ? li(false, "No FM-1 answered. Plug in the unit and close any mirror tab.") : n > 1 ? li(false, n + " FM-1s are on USB. Unplug all but the one to flash.") : li(null, "USB could not be checked from here; the installer will check.");
  const renLine = !files.length ? li(null, "No renders yet. The flash runs the checks and renders first, and stops if anything is flagged.") : flag ? li(false, flag + " render(s) flagged. Open the Analyzer; the flash will stop on these.") : li(true, files.length + " renders measured, none flagged. They are measured again before the flash.");
  const blocked = n === 0 || n > 1;
  c2.innerHTML = '<div class="confirm" style="flex-direction:column;align-items:stretch"><b>Flash ' + esc(name) + "</b>" + usbLine + renLine +
    '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mirChk"' + (blocked ? " disabled" : "") + "> Mirror tabs (localhost:8577 / 8578) and other MIDI programs are closed</label>" +
    '<div class="row" style="margin:0"><button class="primary" data-go="' + id + '" id="goBtn" disabled>Flash it</button><button data-no>Cancel</button>' + (blocked ? '<button data-flash="' + id + '">Check again</button>' : "") + "</div></div>";
  const chk = $("#mirChk"); if (chk) chk.onchange = () => { $("#goBtn").disabled = !chk.checked; };
}
function renderUnitSteps() { if (page() === "units" && !busy) renderUnits(); }
/* ---- sample lab, inside the console ---- */
function viewLab() { $("#main").innerHTML = '<div class="row"><h1 style="margin:0 12px 0 0">Sample Lab</h1><a href="/samplelab/" target="_blank" rel="noopener"><button>Open on its own</button></a></div><iframe class="frame" src="/samplelab/" title="SFA Sample Lab"></iframe>'; }
/* ---- prototype: the plan for our own box, from hardware/prototype/spec.json ---- */
let spec = null, protoTab = "overview", mult = 3;
const money = v => "$" + (+v).toFixed(2).replace(/\.00$/, "");
async function viewProto() {
  $("#main").innerHTML = '<h1>Prototype</h1><p class="lede">Our own small groovebox: the plan, the parts and what is still open. Prices are marked as quotes (seen on a vendor page) or estimates (not verified).</p><div id="protoBox">Loading...</div>';
  try { spec = spec || await (await api("/api/prototype")).json(); } catch (e) { $("#protoBox").textContent = "hardware/prototype/spec.json is not here yet."; return; }
  drawProto();
}
function drawProto() {
  const sp = spec, tabs = [["overview", "Overview"], ["spec", "Spec"], ["parts", "Parts and cost"], ["platforms", "Platforms"], ["fm1", "Versus the FM-1"], ["open", "Open questions"]];
  const rowsP = sp.bom.filter(r => r.category !== "product-estimate"), rowsX = sp.bom.filter(r => r.category === "product-estimate"), sum = a => a.reduce((t, r) => t + r.qty * r.unit_usd, 0);
  const tp = sum(rowsP), tx = sum(rowsX), tg = sp.target;
  let h = '<div class="sub">' + tabs.map(t => '<button data-pt="' + t[0] + '" class="' + (t[0] === protoTab ? "on" : "") + '">' + t[1] + "</button>").join("") + "</div>";
  if (protoTab === "overview") {
    h += '<div class="kpis"><div class="kpi"><label>Retail target</label><output>' + money(tg.retail_min) + "\u2013" + money(tg.retail_max) + '</output></div><div class="kpi"><label>BOM target</label><output>' + money(tg.bom_target_max) + '</output></div><div class="kpi"><label>First prototype parts</label><output>' + money(tp) + '</output></div><div class="kpi"><label>Product BOM estimate</label><output class="' + (tx > tg.bom_target_max ? "est" : "q") + '">' + money(tx) + "</output></div></div>" +
      '<div class="card"><p style="margin:0">' + esc(sp.summary) + '</p><p style="color:var(--dim);margin:10px 0 0">' + esc(tg.assumptions) + "</p></div>" +
      '<h2 style="font:700 16px var(--display);margin:18px 0 6px">Next steps</h2><ul class="clean">' + sp.next_steps.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
      '<p style="color:var(--dim);font-size:12px;margin-top:14px">Plan last updated ' + esc(sp.updated) + ". Written from web research; check any price or spec before you rely on it. Full text: hardware/prototype/README.md.</p>";
  } else if (protoTab === "spec") {
    h += sp.sections.map(x => '<div class="card" style="margin-bottom:12px"><h2 style="margin:0 0 4px;font:700 16px var(--display)">' + esc(x.title) + '</h2><div style="color:var(--dim)">' + esc(x.summary) + '</div><div class="items">' + x.items.map(i => "<b>" + esc(i.label) + "</b><div>" + esc(i.value) + (i.note ? "<small>" + esc(i.note) + "</small>" : "") + "</div>").join("") + "</div></div>").join("");
  } else if (protoTab === "parts") {
    const need = n => n / mult, ok = tx <= tg.bom_target_max;
    h += '<div class="kpis"><div class="kpi"><label>Product BOM</label><output>' + money(tx) + '</output><div class="bar ' + (ok ? "" : "over") + '"><i style="width:' + Math.min(100, tx / tg.bom_target_max * 100) + '%"></i></div></div><div class="kpi"><label>Retail at <select id="multSel"><option>2</option><option>2.5</option><option>3</option><option>3.5</option><option>4</option></select> x BOM</label><output>' + money(tx * mult) + '</output></div><div class="kpi"><label>BOM that hits $199</label><output>' + money(need(199)) + '</output></div><div class="kpi"><label>Gap to the target</label><output class="' + (ok ? "q" : "est") + '">' + (ok ? "none" : money(tx - tg.bom_target_max) + " over") + "</output></div></div>" +
      '<h2 style="font:700 16px var(--display);margin:6px 0">First prototype (off-the-shelf parts): ' + money(tp) + '</h2><div class="tw card" style="padding:0">' + bomTable(rowsP) + '</div><h2 style="font:700 16px var(--display);margin:18px 0 6px">Product estimate (custom board, volume): ' + money(tx) + '</h2><div class="tw card" style="padding:0">' + bomTable(rowsX) + '</div><p style="color:var(--dim);font-size:12px;margin-top:10px">' + sp.bom.filter(r => r.confidence === "quote").length + " of " + sp.bom.length + " lines are quotes; the rest are estimates and need a real quote before they mean anything.</p>";
  } else if (protoTab === "platforms") {
    h += '<div class="card tw" style="padding:0"><table><tr><th>Platform</th><th>SoC</th><th>Price</th><th>Verdict</th><th style="text-align:left">For</th><th style="text-align:left">Against</th></tr>' + sp.platforms.map(p => "<tr><td>" + esc(p.name) + "</td><td>" + esc(p.soc) + "</td><td>" + (p.price_usd == null ? '<span class="est">unverified</span>' : money(p.price_usd)) + '</td><td><span class="pill ' + (/choose/.test(p.verdict) ? "clean" : p.verdict === "maybe" ? "watch" : "none") + '">' + esc(p.verdict) + '</span></td><td style="text-align:left;white-space:normal;min-width:220px">' + p.pros.map(esc).join("; ") + '</td><td style="text-align:left;white-space:normal;min-width:240px">' + p.cons.map(esc).join("; ") + "</td></tr>").join("") + "</table></div>";
  } else if (protoTab === "fm1") {
    h += '<div class="card tw" style="padding:0"><table><tr><th style="text-align:left">FM-1 limit</th><th style="text-align:left">Prototype</th><th style="text-align:left">Evidence</th></tr>' + sp.improvements.map(i => '<tr><td style="text-align:left;white-space:normal;min-width:240px">' + esc(i.fm1_limit) + '</td><td style="text-align:left;white-space:normal;min-width:240px">' + esc(i.prototype) + '</td><td style="text-align:left;white-space:normal;color:var(--dim)">' + esc(i.evidence) + "</td></tr>").join("") + "</table></div>";
  } else {
    h += sp.open_questions.map(q => '<div class="card" style="margin-bottom:10px"><b>' + esc(q.q) + '</b><div style="color:var(--dim);margin-top:4px">' + esc(q.why) + '</div><div style="margin-top:4px"><small class="mono" style="color:var(--dim)">HOW TO ANSWER</small> ' + esc(q.how_to_answer) + "</div></div>").join("");
  }
  $("#protoBox").innerHTML = h; const m = $("#multSel"); if (m) { m.value = String(mult); m.onchange = () => { mult = +m.value; drawProto(); }; }

/* ---- tiny markdown viewer (escapes everything first; links only to http(s) or other docs) ---- */
function md(src) {
  const inl = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, a, u) => /^https?:\/\//.test(u) ? '<a href="' + u + '" target="_blank" rel="noopener">' + a + "</a>" : /^[\w.\/-]+\.md(#.*)?$/.test(u) ? '<a href="#docs" data-doc="' + u.replace(/#.*/, "") + '">' + a + "</a>" : a);
  const L = src.replace(/\r/g, "").split("\n"); let o = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { let b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; o += "<pre>" + esc(b.join("\n")) + "</pre>"; continue; }
    let m;
    if ((m = /^(#{1,4})\s+(.*)/.exec(l))) { o += "<h" + m[1].length + ">" + inl(m[2]) + "</h" + m[1].length + ">"; i++; continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(L[i + 1] || "")) { const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()); let t = "<div class=\"tw\"><table><tr>" + row(l).map(c => "<th>" + inl(c) + "</th>").join("") + "</tr>"; i += 2; while (i < L.length && /^\|.*\|\s*$/.test(L[i])) t += "<tr>" + row(L[i++]).map(c => "<td>" + inl(c) + "</td>").join("") + "</tr>"; o += t + "</table></div>"; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ord = /^\s*\d+\./.test(l); let t = ord ? "<ol>" : "<ul>"; while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) { let it = L[i].replace(/^\s*([-*]|\d+\.)\s+/, ""); i++; while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*]|\d+\.)\s+/.test(L[i])) it += " " + L[i++].trim(); t += "<li>" + inl(it) + "</li>"; } o += t + (ord ? "</ol>" : "</ul>"); continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    let p = []; while (i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,4}\s|```|\s*([-*]|\d+\.)\s+|\|)/.test(L[i])) p.push(L[i++]); o += "<p>" + inl(p.join(" ")) + "</p>";
  }
  return o;
}
